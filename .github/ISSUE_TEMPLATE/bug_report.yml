name: Bug report
description: Report a defect in woocommerce-mcp
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Redact consumer keys, secrets, and customer data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the server with ...
        2. Call tool ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: woocommerce-mcp version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.x
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - streamable HTTP
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Stderr or the tool error JSON. Remove secrets and personal data.
    validations:
      required: false
