name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${version}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: github.ref_type == 'tag' || inputs.dry-run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ github.event.repository.private == false }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          flags="--access public"
          if [ "${PROVENANCE}" = "true" ]; then flags="${flags} --provenance"; fi
          npm publish ${flags}

  mcp-registry:
    name: Publish to the MCP Registry
    needs: publish
    if: github.ref_type == 'tag' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check server.json matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "${v}" != "${tag}" ]; then
              echo "server.json version ${v} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          done

      - name: Wait for the npm package
        run: |
          name="$(jq -r '.packages[0].identifier' server.json)"
          version="$(jq -r '.packages[0].version' server.json)"
          for i in $(seq 1 30); do
            if npm view "${name}@${version}" version >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "${name}@${version} is not on npm" >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
