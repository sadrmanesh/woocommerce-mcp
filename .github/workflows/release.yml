name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${version}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: github.ref_type == 'tag' || inputs.dry-run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ github.event.repository.private == false }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          flags="--access public"
          if [ "${PROVENANCE}" = "true" ]; then flags="${flags} --provenance"; fi
          npm publish ${flags}

  mcp-registry:
    name: Publish to the MCP Registry
    needs: publish
    if: github.ref_type == 'tag' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check server.json matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "${v}" != "${tag}" ]; then
              echo "server.json version ${v} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          done

      - name: Wait for the npm package
        run: |
          name="$(jq -r '.packages[0].identifier' server.json)"
          version="$(jq -r '.packages[0].version' server.json)"
          for i in $(seq 1 30); do
            if npm view "${name}@${version}" version >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "${name}@${version} is not on npm" >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

  github-packages:
    name: Publish to GitHub Packages
    needs: publish
    if: github.ref_type == 'tag' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@sadrmanesh'

      - name: Install
        run: npm ci

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${name}@${version} is already on GitHub Packages"
            exit 0
          fi
          npm publish --registry https://npm.pkg.github.com

  docker:
    name: Publish the Docker image to GHCR
    needs: publish
    if: github.ref_type == 'tag' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sadrmanesh/woocommerce-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=woocommerce-mcp
            org.opencontainers.image.description=MCP server for managing WooCommerce stores over stdio or authenticated streamable HTTP
            org.opencontainers.image.source=https://github.com/sadrmanesh/woocommerce-mcp
            org.opencontainers.image.url=https://sadrmanesh.github.io/woocommerce-mcp/
            org.opencontainers.image.documentation=https://sadrmanesh.github.io/woocommerce-mcp/install/
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Naser Sadrmanesh
            io.modelcontextprotocol.server.name=io.github.sadrmanesh/woocommerce-mcp
          annotations: |
            org.opencontainers.image.title=woocommerce-mcp
            org.opencontainers.image.description=MCP server for managing WooCommerce stores over stdio or authenticated streamable HTTP
            org.opencontainers.image.source=https://github.com/sadrmanesh/woocommerce-mcp
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
